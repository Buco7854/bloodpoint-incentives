name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recheck the current main branch every Monday, even without source changes (UTC).
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  hub:
    name: Hub (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  web:
    name: Web + agent (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web && npm run build:agent
